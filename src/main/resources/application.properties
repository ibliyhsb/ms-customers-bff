spring.application.name=ms-customers-bff

server.port=8082

# JWT Configuration
# IMPORTANT: In production, use environment variables or secure configuration management (e.g., Spring Cloud Config, Vault)
# Example: jwt.secret=${JWT_SECRET}
jwt.secret=your-256-bit-secret-key-change-this-in-production-make-it-longer-and-more-secure
jwt.expiration=900000
jwt.refresh-expiration=604800000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.cl.duoc.ms_customers_bff=DEBUG
